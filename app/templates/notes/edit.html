{% extends "base.html" %}

{% block title %}Edit Note - EduSmart AI{% endblock %}
{% block page_title %}Edit Note{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm p-4">
      <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
        <h5 class="fw-bold mb-0"><i class="bi bi-pencil text-primary me-2"></i>Edit Note</h5>
        <a href="{{ url_for('notes.view', note_id=note.id) }}" class="btn btn-outline-secondary btn-sm">
          Cancel
        </a>
      </div>

      <form method="POST" action="{{ url_for('notes.edit', note_id=note.id) }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Note Title</label>
          <input type="text" name="title" class="form-control" value="{{ note.title }}" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Subject / Course</label>
            <select name="subject_id" class="form-select">
              <option value="">-- General Knowledge --</option>
              {% for subj in subjects %}
              <option value="{{ subj.id }}" {% if note.subject_id == subj.id %}selected{% endif %}>{{ subj.name }} ({{ subj.code }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Category</label>
            <select name="category" class="form-select">
              <option value="Lecture" {% if note.category == 'Lecture' %}selected{% endif %}>Lecture Notes</option>
              <option value="Revision" {% if note.category == 'Revision' %}selected{% endif %}>Exam Revision</option>
              <option value="Formula" {% if note.category == 'Formula' %}selected{% endif %}>Formulas & Definitions</option>
              <option value="General" {% if note.category == 'General' %}selected{% endif %}>General / Scratchpad</option>
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Note Content</label>
          <textarea name="content" class="form-control" rows="10" required>{{ note.content }}</textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('notes.view', note_id=note.id) }}" class="btn btn-light">Cancel</a>
          <button type="submit" class="btn btn-primary px-4">Update Note</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
