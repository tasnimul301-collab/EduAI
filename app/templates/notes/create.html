{% extends "base.html" %}

{% block title %}Create Note - EduSmart AI{% endblock %}
{% block page_title %}New Digital Note{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm p-4">
      <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
        <h5 class="fw-bold mb-0"><i class="bi bi-pencil-square text-primary me-2"></i>Create Note</h5>
        <a href="{{ url_for('notes.index') }}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Back to Notes
        </a>
      </div>

      <form method="POST" action="{{ url_for('notes.create') }}" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Note Title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Asymptotic Complexity and Recurrences" value="{{ title or '' }}" required autofocus>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Subject / Course</label>
            <select name="subject_id" class="form-select">
              <option value="">-- General Knowledge --</option>
              {% for subj in subjects %}
              <option value="{{ subj.id }}">{{ subj.name }} ({{ subj.code }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Note Category</label>
            <select name="category" class="form-select">
              <option value="Lecture" selected>Lecture Notes</option>
              <option value="Revision">Exam Revision</option>
              <option value="Formula">Formulas & Definitions</option>
              <option value="General">General / Scratchpad</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">Note Content (Text / Markdown)</label>
          <textarea name="content" class="form-control" rows="10" placeholder="Type your lecture summaries, key ideas, algorithms, or formulas here..." required>{{ content or '' }}</textarea>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Attach PDF File (Optional)</label>
          <input type="file" name="pdf_file" class="form-control" accept=".pdf">
          <div class="form-text">Attach lecture slides or textbook excerpts (PDF format, max 10MB).</div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('notes.index') }}" class="btn btn-light">Cancel</a>
          <button type="submit" class="btn btn-primary px-4">Save Note</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
