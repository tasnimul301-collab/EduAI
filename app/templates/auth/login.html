{% extends "base.html" %}

{% block title %}Sign In - EduSmart AI{% endblock %}

{% block guest_content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4 shadow-sm border-0 rounded-4">
      <div class="text-center mb-4">
        <div class="stat-icon-box bg-primary-subtle text-primary mx-auto mb-2">
          <i class="bi bi-box-arrow-in-right fs-3"></i>
        </div>
        <h4 class="fw-bold">Welcome Back</h4>
        <p class="text-muted small">Sign in to your EduSmart AI workspace</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" name="identifier" class="form-control border-start-0" placeholder="student or student@university.edu" value="{{ identifier if identifier else '' }}" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
          Sign In
        </button>
      </form>

      <div class="text-center small text-muted">
        Don't have an account? 
        <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create one</a>
      </div>

      <!-- Quick Demo Pill -->
      <div class="mt-4 pt-3 border-top text-center">
        <small class="text-muted d-block mb-1">Quick Demo Accounts:</small>
        <span class="badge bg-light text-dark border me-1">Student: student / student123</span>
        <span class="badge bg-light text-dark border">Admin: admin / admin123</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
